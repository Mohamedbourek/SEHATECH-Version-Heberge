<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEHATECH — Accès Applications</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo-B_xPjg1L.svg" />
    <style>
      :root { --primary: #0EA5E9; --bg: #0b1220; --card: #111827; --text: #e5e7eb; --muted: #9ca3af; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: linear-gradient(180deg, #0b1220 0%, #0b1729 100%); color: var(--text); }
      .container { max-width: 980px; margin: 0 auto; padding: 32px 24px; }
      .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 40px; height: 40px; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: 0.2px; }
      .subtitle { color: var(--muted); margin-top: 4px; }
      .card { background: rgba(17,24,39,0.7); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
      .table { width: 100%; border-collapse: collapse; }
      .thead th { text-align: left; padding: 14px 16px; font-size: 14px; color: var(--muted); background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08); }
      .row { border-bottom: 1px solid rgba(255,255,255,0.08); }
      .cell { padding: 16px; vertical-align: middle; }
      .app-name { font-weight: 600; }
      .cred { display: flex; gap: 8px; align-items: center; }
      .cred input { width: 280px; max-width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: var(--text); outline: none; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); color: var(--text); background: rgba(255,255,255,0.06); cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
      .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.1); }
      .btn.primary { background: var(--primary); border-color: #0d92ca; color: white; }
      .footer { margin-top: 18px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
      .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(14,165,233,0.16); color: #7dd3fc; border: 1px solid rgba(14,165,233,0.3); }
      @media (max-width: 720px) { .cred { flex-direction: column; align-items: stretch; } .cred input { width: 100%; } }
    </style>
    <script type="module" crossorigin src="/assets/index-DENbkJXi.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
